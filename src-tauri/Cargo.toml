[package]
name = "taigi-asr-desktop"
version = "1.0.0"
description = "台語語音自動轉錄桌面客戶端"
authors = ["Taigi ASR Desktop contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop host is a single binary; rlib is kept so integration tests
# (future) could link against it.
name = "taigi_asr_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
