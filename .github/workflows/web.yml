name: web

# 網頁版：建置 whisper.cpp WebAssembly，並把 web/ 部署到 GitHub Pages。
# 觸發：推送到 main（web/ 有變更）、手動、或發版 tag。
#
# 注意：GitHub Actions 的 on.push 一旦寫了 paths，對「打 tag」的推送也會
# 套用該過濾，發版時可能因此被跳過。所以 tag 觸發不放在這裡，
# 而是由 workflow_dispatch 手動觸發，或依賴 main 分支的部署。
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  WHISPER_CPP_TAG: v1.9.5

jobs:
  # ------------------------------------------------------------------
  # 1) 編譯 WASM（慢，可快取）
  # ------------------------------------------------------------------
  wasm:
    name: Build whisper.cpp WASM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache whisper.cpp source + wasm build
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper-wasm/whisper.cpp
            .cache/whisper-wasm/build
          key: wasm-${{ env.WHISPER_CPP_TAG }}-${{ hashFiles('web/wasm-src/**') }}
          restore-keys: |
            wasm-${{ env.WHISPER_CPP_TAG }}-

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM
        run: |
          chmod +x web/wasm-src/build-wasm.sh
          # 腳本內含防護：ggml 若退回無 SIMD 的通用實作、產物不是 ES module
          # 或缺 pthread，都會直接讓建置失敗（避免部署出慢數十倍的版本）。
          bash web/wasm-src/build-wasm.sh

      - name: Verify build guards
        run: bash scripts/test-wasm-build-guards.sh

      - name: Subtitle format parity
        run: python3 tools/verify-subtitle-parity.py

      - name: Lint web + tools JavaScript
        run: |
          set -euo pipefail
          fail=0
          for f in $(find web tools -name '*.js' -o -name '*.mjs'); do
            if ! node --check "$f"; then
              echo "語法錯誤：$f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          echo "JS 語法檢查通過"

      - name: Setup pnpm / Node（供瀏覽器端測試使用）
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Model cache regression
        run: node tools/verify-model-cache.mjs

      - name: WASM loads in a real browser
        run: node tools/verify-wasm-browser.mjs

      - name: Responsive layout + UI (desktop / tablet / phone)
        run: node tools/e2e-web.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web/screenshots/
          if-no-files-found: ignore

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-wasm
          path: web/wasm/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) 打包靜態網站（WASM + 前端）並部署到 Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: wasm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: whisper-wasm
          path: web/wasm

      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # web/ 是自包含的靜態站（含圖示、coi-serviceworker.js、WASM）
          cp -r web/. _site/
          # GitHub Pages 用 Jekyll 會忽略底線開頭的路徑
          touch _site/.nojekyll
          # 移除不屬於網站內容的建置來源與測試截圖
          rm -rf _site/wasm-src _site/screenshots
          echo "--- 站點內容 ---"
          find _site -maxdepth 2 -type f | sort | head -n 40
          echo "--- WASM 產物 ---"
          ls -lh _site/wasm/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # enablement: true 會在 Pages 尚未啟用時，用本工作流的 GITHUB_TOKEN
          # 自動建立站點（工作流已宣告 pages: write 權限），
          # 因此不需要任何人手動到 Settings → Pages 開啟。
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
