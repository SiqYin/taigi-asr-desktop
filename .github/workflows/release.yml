name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 由本工作流獨占 Release：Windows 與 Android 兩個 job 都寫入同一個 Release，
# 但 android job 依賴 windows job 先建立 Release，因此不會有兩個工作流
# 併發建立／更新同一個 Release 的競態。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WHISPER_CPP_TAG: v1.9.5

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: 安裝前端依賴
        run: pnpm install
      - name: 編譯並發布 Windows 安裝包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: "台語語音轉錄 ${{ github.ref_name }}"
          releaseBody: |
            ## 台語語音自動轉錄 · 桌面版（Windows）· 安卓版 · 網頁版

            同一個 Breeze-ASR-26 台語模型，三種使用方式，輸出格式完全一致
            （SRT / VTT / TXT / JSON，已用自動化測試驗證逐位元組相同）。

            ---

            ### 1. 桌面版（Windows x64）— **推薦，最快**

            下載 `Taigi ASR_*_x64-setup.exe` 並執行。

            - 首次啟動會自動準備本機 Python 環境，並下載模型（約 2.9 GB，僅此一次）
            - 拖入台語影片／音訊即可離線轉錄
            - 有 NVIDIA GPU 時自動 CUDA 加速（4GB+ 顯存）；無 GPU 亦可純 CPU 執行
            - **速度：約 0.2–1.0 倍即時**（1 小時影片約 12–60 分鐘）

            ### 2. 安卓版（Android 7.0+）

            下載 `TaigiASR-*-android.apk` 並安裝（需允許「安裝未知來源應用」）。

            - 完全離線運算，檔案不上傳
            - 字幕自動存入系統「下載」資料夾
            - **速度：約 9–19 倍即時**，適合短音檔（1–3 分鐘）

            ### 3. 網頁版（免安裝，任何裝置）

            **<https://siqyin.github.io/taigi-asr-desktop/>**

            - 開啟網址即用，模型下載一次後存在瀏覽器快取
            - 全程在瀏覽器內推理，不上傳任何檔案
            - 桌機／手機／平板（含橫向）都已調校版面
            - **速度與安卓版相同（約 9–19 倍即時）**，定位是臨時、輕量、隱私優先的場景

            ---

            ### 三種版本怎麼選

            | 情境 | 建議 |
            | --- | --- |
            | 長影片、批次處理、日常使用 | **桌面版** |
            | 手機上轉一段錄音 | 安卓版 或 網頁版 |
            | 別人的電腦、無法安裝軟體 | **網頁版** |

            > 網頁版與安卓版因為是瀏覽器 WASM 環境，無法使用原生 AVX 指令集，
            > 速度比桌面版慢約 40 倍。功能完全相同，但**不建議用來處理長影片**。

            ### 系統需求
            - **桌面版**：Windows 10 / 11 x64（WebView2 通常已內建）
            - **安卓版**：Android 7.0 以上，建議 4 GB 以上記憶體
            - **網頁版**：Chrome / Edge / Safari 任一現代瀏覽器
          releaseDraft: false
          prerelease: false

  # ------------------------------------------------------------------
  # 安卓 APK
  #
  # 併入本工作流而非獨立觸發，是為了讓 Release 只有一個擁有者：
  # 先前 android.yml 也在 tag 上觸發，兩個工作流併發建立／更新同一個
  # Release，造成
  #   Resource not accessible by integration ... #update-a-release
  # 的失敗。改成 needs: release-windows 之後，Release 必定已存在，
  # 這裡只負責附加檔案。
  # ------------------------------------------------------------------
  release-android:
    name: Build Android APK
    needs: release-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 已預裝 Android SDK；不用 android-actions/setup-android
      # （其期望的 cmdline-tools 版本與預裝不符，實測會失敗）。
      - name: Verify Android SDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          test -d "${ANDROID_SDK_ROOT}"
          ls "${ANDROID_SDK_ROOT}/platforms" 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache whisper.cpp source
        uses: actions/cache@v4
        with:
          path: .cache/whisper-wasm/whisper.cpp
          key: whisper-src-${{ env.WHISPER_CPP_TAG }}-${{ hashFiles('web/wasm-src/**') }}
          restore-keys: |
            whisper-src-${{ env.WHISPER_CPP_TAG }}-

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest

      - name: Build whisper.cpp WASM
        run: |
          chmod +x web/wasm-src/build-wasm.sh scripts/stage-android-assets.sh
          bash web/wasm-src/build-wasm.sh

      - name: Stage web assets into the APK
        run: bash scripts/stage-android-assets.sh

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$SRC" "TaigiASR-${VERSION}-android.apk"
          ls -lh TaigiASR-*-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TaigiASR-*-android.apk
          if-no-files-found: error

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: TaigiASR-*-android.apk
