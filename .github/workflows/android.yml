name: android

# 安卓版：把網頁版 + WASM 打包成 WebView 殼 APK。
#
# 觸發：
#   - push tag v*  ：發版，建置後把 APK 附加到該 Release
#   - push main    ：建置驗證，APK 只作為 workflow artifact 保留
#   - 手動觸發
#
# 刻意不在 on.push 裡寫 paths —— GitHub Actions 一旦寫了 paths，
# 對「打 tag」的推送也會套用該過濾，發版時可能被跳過。
# WASM 編譯有快取，重複建置成本可接受。
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_CPP_TAG: v1.9.5

# release.yml 與本工作流都會寫入同一個 Release，序列化避免競態。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04 runner 預設沒有 Android SDK，必須先安裝。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache whisper.cpp source + wasm build
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper-wasm/whisper.cpp
            .cache/whisper-wasm/build
          key: wasm-${{ env.WHISPER_CPP_TAG }}-${{ hashFiles('web/wasm-src/**') }}
          restore-keys: |
            wasm-${{ env.WHISPER_CPP_TAG }}-

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest

      - name: Build whisper.cpp WASM
        run: |
          chmod +x web/wasm-src/build-wasm.sh scripts/stage-android-assets.sh
          bash web/wasm-src/build-wasm.sh

      - name: Verify WASM output
        run: |
          set -euo pipefail
          test -f web/wasm/main.js
          test -f web/wasm/main.wasm
          grep -q "export default" web/wasm/main.js
          grep -q "PThread" web/wasm/main.js
          echo "WASM 產物檢查通過（$(du -h web/wasm/main.wasm | cut -f1)）"

      - name: Stage web assets into the APK
        run: bash scripts/stage-android-assets.sh

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="dev-${GITHUB_RUN_NUMBER}"; fi
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$SRC" "TaigiASR-${VERSION}-android.apk"
          ls -lh TaigiASR-*-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TaigiASR-*-android.apk
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TaigiASR-*-android.apk
