name: android

# 安卓版：把網頁版 + WASM 打包成 WebView 殼 APK（建置驗證）。
#
# 這裡只負責 main 分支的建置驗證，APK 以 workflow artifact 保留。
# 發版（tag v*）時的 APK 由 release.yml 的 release-android job 負責 ——
# 讓 Release 只有一個擁有者，避免兩個工作流併發建立／更新同一個 Release
# 而失敗（Resource not accessible by integration）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WHISPER_CPP_TAG: v1.9.5
  # ubuntu-22.04 runner 已預裝 Android SDK（含 cmdline-tools 與多個 platform）。
  # 不使用 android-actions/setup-android：它會呼叫 sdkmanager，而預裝的
  # cmdline-tools 版本與該 action 期望的不符，實測失敗於：
  #   Wrong version in preinstalled sdkmanager
  #   Warning: Failed to find package 'tools'
  #   Error: The process 'sdkmanager' failed with exit code 1
  # 直接指定路徑給 Gradle 最穩定。
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

# release.yml 與本工作流都會寫入同一個 Release，序列化避免競態。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 確認預裝 SDK 可用（比 setup-android 可靠，失敗時訊息也清楚）
      - name: Verify Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_SDK_ROOT}" || { echo "找不到 Android SDK 目錄" >&2; exit 1; }
          ls "${ANDROID_SDK_ROOT}"
          echo "--- platforms ---"
          ls "${ANDROID_SDK_ROOT}/platforms" 2>/dev/null || echo "(無 platforms 目錄)"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cache whisper.cpp source
        uses: actions/cache@v4
        with:
          # 只快取原始碼。build 目錄不快取：emsdk 每次安裝在臨時路徑，
          # 舊的 CMakeSystem.cmake 會記住上次的 toolchain 路徑而導致 configure 失敗。
          path: |
            .cache/whisper-wasm/whisper.cpp
          key: whisper-src-${{ env.WHISPER_CPP_TAG }}-${{ hashFiles('web/wasm-src/**') }}
          restore-keys: |
            whisper-src-${{ env.WHISPER_CPP_TAG }}-

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest

      - name: Build whisper.cpp WASM
        run: |
          chmod +x web/wasm-src/build-wasm.sh scripts/stage-android-assets.sh
          bash web/wasm-src/build-wasm.sh

      - name: Verify build guards
        run: bash scripts/test-wasm-build-guards.sh

      - name: Stage web assets into the APK
        run: bash scripts/stage-android-assets.sh

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          set -euo pipefail
          VERSION="dev-${GITHUB_RUN_NUMBER}"
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$SRC" "TaigiASR-${VERSION}-android.apk"
          ls -lh TaigiASR-*-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TaigiASR-*-android.apk
          if-no-files-found: error


