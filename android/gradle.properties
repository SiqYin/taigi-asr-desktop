# 安卓建置設定
#
# 使用 androidx（WebViewAssetLoader）必須開啟這個旗標，
# 否則 Gradle 會報 "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled"。
android.useAndroidX=true

# 使用 AndroidX 後 Jetifier 已無必要，關掉可加快建置。
android.enableJetifier=false

# 記憶體：WASM 資產較大（約 1.3 MB）加上資源處理，預設 heap 可能不足。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 平行建置與快取
org.gradle.parallel=true
org.gradle.caching=true

# 非必要：關閉不必要的 ABI 分割（本 App 不含原生庫）
android.nonTransitiveRClass=true
